font=CaskaydiaCove Nerd Font, size=14
dpi-aware=yes
icon-theme=Papirus
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=yes
terminal=kitty -e

lines=15
width=45

[border]
width=2
radius=12

[dmenu]
mode=index

[colors]
background="{{colors.surface.default.hex}}e6"
text="{{colors.on_surface.default.hex}}ff"
match="{{colors.primary.default.hex}}ff"
selection="{{colors.secondary_container.default.hex}}ff"
selection-text="{{colors.on_secondary_container.default.hex}}ff"
selection-match="{{colors.primary.default.hex}}ff"
border="{{colors.surface_tint.default.hex}}ff"
