# Script & profile pic path
$scripts      		      = $HOME/.config/hypr/scripts

# Sourcing matugen colors
source 	                = colors/matugen-hyprlock.conf

# Hardcode your location (If hardcode does not recognize your City, change it to IP Geolocation provider in weatherinfo)
$CITY         		      = Singur
$COUNTRY      		      = India

# WALLPAPER
$wallpaper    		      = $image
$blur         		      = 2

# ADJUST HERE
$rounding     		      = 12
$shape-rd     		      = -1
$font-text    		      = CaskaydiaCove Nerd Font
$font-text0   		      = CaskaydiaCove Nerd Font
$font-display 		      = CaskaydiaCove Nerd Font

# Input Var
$weight       		      = 2
$inner-color  		      = $surface_alpha
$border-color 		      = $on_surface
$check-color		        = $tertiary
$error-color		        = $error
$capslock-color		      = $on_surface
$numlock-color		      = $tertiary
$bothlock-color	        = $primary

# Colors
$clock-color        	  = $primary
$fg0                	  = $on_surface
$fg1                	  = $on_tertiary_container
$shape-col0         	  = $surface
$shape-col1         	  = $surface_alpha
$shape-col2         	  = $surface
$shadow-pass        	  = 3
$shadow-size        	  = 4
$shadow-color       	  = rgba(000000ff)
$shadow-boost       	  = 1.2
$text-shadow-pass   	  = 1
$text-shadow-boost  	  = 0.5



# GENERAL
general {
    no_fade_in          = true
    grace               = 0
    disable_loading_bar = false
    hide_cursor         = true
    ignore_empty_input  = true
    text_trim           = true
}

#BACKGROUND
background {
    path        	      = $wallpaper
    blur_passes         = $blur
    contrast            = 0.8916
    brightness          = 0.7172
    vibrancy            = 0.1696
    vibrancy_darkness   = 0
}

# WEATHERCAST & LOCATION
label {
    text        	      = cmd[update:1000] echo "$(bash $scripts/weatherinfo)"

    shadow_passes       = 1
    shadow_boost        = 0.5

    color               = $fg0
    font_size           = 11
    font_family         = $font-text

    position            = 0, -20
    halign              = center
    valign              = top
}

# INPUT FIELD
input-field {
    size        	      = 275, 55
    rounding    	      = $rounding

    outline_thickness   = $weight
    outer_color         = $border-color
    dots_size           = 0.1 # Scale of input-field height, 0.2 - 0.8
    dots_spacing        = 1 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center         = true

    inner_color         = $inner-color
    font_color          = $fg0
    fade_on_empty       = false

    font_family         = $font-text
    placeholder_text    = <span>󰢏  $USER</span>
    hide_input          = false
    check_color         = $check-color
    fail_color          = $error-color
    cpaslock_color	    = $capslock-color
    numlock_color	      = $numlock-color
    bothlock_color	    = $bothlock-color
    swap_font_color	    = true
    position            = 0, -120
    halign              = center
    valign              = center
    zindex              = 10
}

# TIME HR
label {
    text                = cmd[update:1000] echo "$(date +"%H")" # 24-Hour Format
    color               = $clock-color

    shadow_passes       = $shadow-pass
    shadow_size         = $shadow-size
    shadow_color        = $shadow-color
    shadow_boost        = $shadow-boost

    font_size           = 150
    font_family         = $font-display

    position            = 0, -155
    halign              = center
    valign              = top
}

# TIME MM
label {
    text        	      = cmd[update:1000] echo "$(date +"%M")"
    color               = $clock-color

    shadow_passes       = $shadow-pass
    shadow_size         = $shadow-size
    shadow_color        = $shadow-color
    shadow_boost        = $shadow-boost

    font_size           = 150
    font_family         = $font-display

    position            = 0, -325
    halign              = center
    valign              = top
}

# DATE
label {
    text        	      = cmd[update:1000] bash -c 'day=$(date +%d); case "$day" in 1) suffix="st";; 2) suffix="nd";; 3) suffix="rd";; *) suffix="th";; esac; echo -e "$(date +"%B %e")'$day'$suffix, $(date +%Y)"'

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $fg0
    font_size           = 14
    font_family         = $font-text

    position            = 0, -30
    halign              = center
    valign              = center
}

# TODAY IS
label {
    text        	      = cmd[update:1000] bash -c 'day=$(date +%A); echo "Today is $day"'

    shadow_passes       = $text-shadow-pass
    shadow_boost        = $text-shadow-boost

    color               = $fg0
    font_size           = 10
    font_family         = $font-text

    position            = 0, -60
    halign              = center
    valign              = center
}
