source = colors/matugen-hyprland.conf

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = $primary 45deg
    col.inactive_border = rgba(595959aa) 45deg

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 9
    rounding_power = 3

    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    dim_inactive = false

    shadow {
        enabled = true
        ignore_window = true
        range = 2
        offset = 2 2
        render_power = 10
    }

    blur {
        enabled = true
        xray = true
        special = false
        new_optimizations = true
        size = 3
        passes = 1
        brightness = 1
        noise = 0.01
        contrast = 1
        popups = true
        popups_ignorealpha = 0.6
        vibrancy = 0.1696
    }    
}

group {
    col.border_active = $primary
    col.border_inactive = $on_secondary
    groupbar {
        font_family = JetBrains Mono
        font_size = 13
        text_color = $on_background
        gaps_out = 10
        col.active = $secondary
        col.inactive = $on_secondary
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    special_scale_factor = 0.8
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
    special_scale_factor = 0.8
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
    mouse_move_enables_dpms = true
    enable_swallow = true
    swallow_regex = ^(wezterm|kitty|Alacritty|ghostty)$
    focus_on_activate = false
    initial_workspace_tracking = 0
    middle_click_paste = false
    disable_hyprland_qtutils_check = true
}

xwayland {
    force_zero_scaling = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

gestures {
  workspace_swipe = true
  workspace_swipe_fingers = 3
  workspace_swipe_invert = true
  workspace_swipe_create_new = true
  workspace_swipe_forever = true
}

binds {
  workspace_back_and_forth = true
  pass_mouse_when_bound = false
}
