
## ── Application Launch Keybinds ───────────────────────────────
bind = Super, Q, exec, uwsm app -- kitty
bind = Super, B, exec, uwsm app -- firefox
bind = Super, E, exec, uwsm app -- nautilus
bind = Super, W, exec, uwsm app -- waypaper
bind = Super, D, exec, uwsm app -- rofi -show drun --run-command "uwsm app -- {cmd}"
bind = Super, V, exec, uwsm app -- kitty --class=clipse -e clipse

bind = Alt, E, exec, uwsm app -- kitty -e yazi
bind = Alt, T, exec, uwsm app -- ~/.config/hypr/scripts/launchterm

## ── Quit Session ──────────────────────────────────────────────
bind = Super+Shift, Q, exec, uwsm app -- wlogout -b 2

## ── Window & Mode Controls ────────────────────────────────────
bind = Super, M, exit
bind = Super, C, killactive
bind = Super, F, fullscreen
bind = Super, J, togglesplit
bind = Super, G, togglegroup

bind = Alt, F, fullscreen, 1

## ── Floating & Centering ──────────────────────────────────────
bind = Super, Space, togglefloating
bind = Super, Space, centerwindow

## ── Focus Navigation ──────────────────────────────────────────
bind = Alt, Tab, cyclenext

## ── Window Swapping ───────────────────────────────────────────
bind = Super+Ctrl, Up, swapwindow, u
bind = Super+Ctrl, Down, swapwindow, d
bind = Super+Ctrl, Left, swapwindow, l
bind = Super+Ctrl, Right, swapwindow, r

## ── Workspace Switching ───────────────────────────────────────
bind = Super, 1, workspace, 1
bind = Super, 2, workspace, 2
bind = Super, 3, workspace, 3
bind = Super, 4, workspace, 4
bind = Super, 5, workspace, 5
bind = Super, 6, workspace, 6
bind = Super, 7, workspace, 7
bind = Super, 8, workspace, 8
bind = Super, 9, workspace, 9
bind = Super, 0, workspace, 10

bind = Super, Left, workspace, -1
bind = Super, Right, workspace, +1

## ── Move Windows to Workspaces ────────────────────────────────
bind = Super+Shift, 1, movetoworkspace, 1
bind = Super+Shift, 2, movetoworkspace, 2
bind = Super+Shift, 3, movetoworkspace, 3
bind = Super+Shift, 4, movetoworkspace, 4
bind = Super+Shift, 5, movetoworkspace, 5
bind = Super+Shift, 6, movetoworkspace, 6
bind = Super+Shift, 7, movetoworkspace, 7
bind = Super+Shift, 8, movetoworkspace, 8
bind = Super+Shift, 9, movetoworkspace, 9
bind = Super+Shift, 0, movetoworkspace, 10

bind = Super+Shift, Left, movetoworkspace, r-1
bind = Super+Shift, Right, movetoworkspace, r+1
bind = Super+Ctrl+Shift, Left, movetoworkspace, emptym-1
bind = Super+Ctrl+Shift, Right, movetoworkspace, emptym

## ── Scratchpad ────────────────────────────────────────────────
bind = Super, S, exec, uwsm app -- ~/.config/hypr/scripts/scratchpad
bind = Super+Shift, S, exec, uwsm app -- ~/.config/hypr/scripts/scratchpad -g

## ── Mouse Controls ────────────────────────────────────────────
bindm = Super, mouse:272, movewindow
bindm = Super+Ctrl, mouse:272, resizewindow

## ── Split Ratio Adjustment ────────────────────────────────────
binde = Alt, Minus, splitratio, -0.1
binde = Alt, Equal, splitratio, 0.1

## ── Volume & Brightness ───────────────────────────────────────
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.2 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindel = ,XF86AudioRaiseVolume, exec,uwsm app -- swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec,uwsm app -- swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec,uwsm app -- swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec,uwsm app -- swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec,uwsm app -- swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec,uwsm app -- swayosd-client --brightness lower

## ── Media Controls ────────────────────────────────────────────
bindl = ,XF86AudioNext, exec, uwsm app -- playerctl next
bindl = ,XF86AudioPause, exec, uwsm app -- playerctl play-pause
bindl = ,XF86AudioPlay, exec, uwsm app -- playerctl play-pause
bindl = ,XF86AudioPrev, exec, uwsm app -- playerctl previous

## ── Screenshots ───────────────────────────────────────────────
bind = , Print, exec, uwsm app -- ~/.config/hypr/scripts/screenshot --area
bind = Super, Print, exec, uwsm app -- ~/.config/hypr/scripts/screenshot --win
bind = Super+Shift, Print, exec, uwsm app -- ~/.config/hypr/scripts/screenshot --full

## ── Extras ────────────────────────────────────────────────────
bind = Super, F1, exec, uwsm app -- ~/.config/hypr/scripts/gamemode
bind = Super, R, exec, uwsm app -- ~/.config/hypr/scripts/hyprfresh

## ── Lid Events ────────────────────────────────────────────────
bindl=,switch:on:Lid Switch, exec, hyprctl dispatch dpms off && hyprctl dispatch exec hyprlock
bindl=,switch:off:Lid Switch, exec, hyprctl dispatch dpms on
