[templates.btop]
input_path  = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"
post_hook   = "command -v btop &>/dev/null && pgrep -x btop >/dev/null && pkill -USR2 -x btop || true"

[templates.cava]
input_path  = "~/.config/matugen/templates/cava.ini"
output_path = "~/.config/cava/config"

[templates.clipse]
input_path  = "~/.config/matugen/templates/clipse.json"
output_path = "~/.config/clipse/themes/matugen.json"

