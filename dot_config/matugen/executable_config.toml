[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/themes/matugen.conf"
post_hook   = "pgrep -x kitty >/dev/null && kitty +kitten themes --reload-in=all matugen && killall -SIGUSR1 kitty || true"

[templates.kvconfig]
input_path  = "~/.config/matugen/templates/kvantum/kvantum.kvconfig"
output_path = "~/.config/Kvantum/matugen/matugen.kvconfig"
post_hook   = "command -v kvantummanager >/dev/null && kvantummanager --set matugen"

[templates.kvsvg]
input_path  = "~/.config/matugen/templates/kvantum/kvantum.svg"
output_path = "~/.config/Kvantum/matugen/matugen.svg"
post_hook   = "command -v kvantummanager >/dev/null && kvantummanager --set matugen"

[templates.lastwall]
input_path  = "~/.config/matugen/templates/lastwall"
output_path = "~/.local/state/matugen/lastwall"

[templates.mako]
input_path  = "~/.config/matugen/templates/mako"
output_path = "~/.config/mako/config"
post_hook   = "makoctl reload"

[templates.mangl]
input_path  = "~/.config/matugen/templates/mangl"
output_path = "~/.manglrc"

