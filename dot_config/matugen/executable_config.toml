# output_path = "~/.config/mango/colors.conf"
# post_hook   = "mmsg -d reload_config"

[templates.neovim]
input_path  = "~/.config/matugen/templates/nvim.lua"
output_path = "~/.config/nvim/lua/themes/matugen.lua"
post_hook   = "pkill -SIGUSR1 nvim || true"

[templates.niri]
input_path  = "~/.config/matugen/templates/niri.kdl"
output_path = "~/.config/niri/matugen.kdl"

[templates.noctavox]
input_path  = "~/.config/matugen/templates/noctavox.toml"
output_path = "~/.config/noctavox/themes/matugen.toml"

[templates.obs]
input_path  = "~/.config/matugen/templates/obs-studio.obt"
output_path = "~/.var/app/com.obsproject.Studio/config/obs-studio/themes/matugen.obt"

[templates.papirus-folders]
input_path = "~/.config/matugen/templates/papirus-folders.toml"
compare_to = "{{colors.primary.default.hex}}"
colors_to_compare = [
    { name = "cat-mocha-rosewater", color = "#f5e0dc" },
    { name = "cat-mocha-flamingo", color = "#f2cdcd" },
    { name = "cat-mocha-pink", color = "#f5c2e7" },
    { name = "cat-mocha-mauve", color = "#cba6f7" },
    { name = "cat-mocha-red", color = "#f38ba8" },
    { name = "cat-mocha-maroon", color = "#eba0ac" },
    { name = "cat-mocha-peach", color = "#fab387" },
    { name = "cat-mocha-yellow", color = "#f9e2af" },
    { name = "cat-mocha-green", color = "#a6e3a1" },
    { name = "cat-mocha-teal", color = "#94e2d5" },
    { name = "cat-mocha-sky", color = "#89dceb" },
    { name = "cat-mocha-sapphire", color = "#74c7ec" },
    { name = "cat-mocha-blue", color = "#89b4fa" },
    { name = "cat-mocha-lavender", color = "#b4befe" },
]
post_hook  = "command -v papirus-folders >/dev/null && papirus-folders -C {{closest_color}} -t Papirus-Dark || true"

[templates.pywalfox]
input_path  = "~/.config/matugen/templates/colors.json"
output_path = "~/.cache/wal/colors.json"
post_hook   = "command -v pywalfox >/dev/null && pywalfox update || true"

[templates.qt5ct]
input_path = "~/.config/matugen/templates/qtct.conf"
