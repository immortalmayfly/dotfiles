# input_path  = "~/.config/matugen/templates/gofer.toml"
# output_path = "~/.config/gofer/config.toml"

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"
post_hook   = "bash -c ~/.config/matugen/scripts/gtk-themes-reload.sh"

[templates.gtklock]
input_path  = "~/.config/matugen/templates/colors.css"
output_path = "~/.config/gtklock/matugen.css"

[templates.imv]
input_path  = "~/.config/matugen/templates/imv"
