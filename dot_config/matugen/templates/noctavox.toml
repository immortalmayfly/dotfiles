[colors]
surface_global      = ""
surface_active      = ""
surface_inactive    = ""
surface_error       = "{{colors.error_container.default.hex}}"

text_primary        = "{{colors.on_surface.default.hex}}"
text_secondary      = "{{colors.primary.default.hex}}"
text_secondary_in   = "{{colors.on_primary_container.default.hex}}"
text_selection      = "{{colors.on_primary.default.hex}}"
text_muted          = "{{colors.on_surface_variant.default.hex}}"

border_active       = "{{colors.primary.default.hex}}"
border_inactive     = "{{colors.outline.default.hex}}"

accent              = "{{colors.primary.default.hex}}"
accent_inactive     = "{{colors.primary_container.default.hex}}"

[progress]
color               = [ "{{colors.primary.default.hex}}", 
                        "{{colors.on_primary_container.default.hex}}",
                        "{{colors.surface_container_high.default.hex}}" ]
unplayed            = "dimmed"
speed               = 2

[borders]
display             = true
style               = "rounded"

[extras]
decorator           = " "
