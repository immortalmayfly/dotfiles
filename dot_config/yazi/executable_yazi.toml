[mgr]
ratio          = [ 1, 2, 2 ]
sort_by        = "natural"
show_hidden    = true

[opener]
edit = [
	{ run = '${EDITOR:-nvim} %s', block = true, desc = "$EDITOR", for = "linux" },
]
play = [
	{ run = "xdg-open %s1", desc = "Play", for = "linux", orphan = true },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]
open = [
	{ run = "xdg-open %s1",    desc = "Open", for = "linux" },
]
reveal = [
	{ run = "xdg-open %d1", desc = "Reveal", for = "linux" },
	{ run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
]
extract = [
	{ run = "ya pub extract --list %s", desc = "Extract here" },
]
download = [
	{ run = "ya emit download --open %S", desc = "Download and open" },
	{ run = "ya emit download %S", desc = "Download" },
]
setwall = [
	{ run = 'matugen image %s1 -t scheme-fruit-salad --source-color-index 0', orphan = true, desc = "Set as wallpaper", for = "linux" }
]

[open]
rules = [
	# Folder
	{ url = "*/", use = [ "edit", "open", "reveal" ] },
	# Text
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	# Image
	{ mime = "image/*", use = [ "open", "reveal", "setwall" ] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Code
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "reveal" ] },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# Empty file
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", use = "download" },
	# Fallback
	{ url = "*", use = [ "open", "reveal" ] },
]

[tasks]
image_bound      = [ 0, 0 ]

[plugin]
prepend_preloaders = [
  # Office Documents
  { mime = "application/{openxmlformats-officedocument.*,oasis.opendocument.*,ms-*,msword}", run = "office" },
  { url = "*.docx",                                                                         run = "office" },

  { url = "*.cb[7rz]", run = "comicthumb" },

  { url = "*.{parquet,txt,xlsx}", run = "duckdb", multi = false }
]

prepend_previewers = [
  # Office Documents
  { mime = "application/{openxmlformats-officedocument.*,oasis.opendocument.*,ms-*,msword}", run = "office" },
  { url = "*.docx",                                                                         run = "office" },

  # --- General preview ---
  { url = "*/", run = "mux eza_tree_1 eza_tree_2 eza_tree_3 eza_tree_4" },

  # --- Preview with duckdb ---
  { url = "*.{parquet,txt,xlsx,db,duckdb}", run = "duckdb" },

  # --- Preview with rich-cli ---
  # { url = "*.md",                run = "rich-preview" },
  { url = "*.ipynb", run = "rich-preview" },
  { url = "*.rst", run = "rich-preview" },
  { url = "*.json", run = "rich-preview" },
  { url = "*.{csv,tsv}", run = "rich-preview" },
  { url = "*.{toml,xml,yaml,yml}", run = "rich-preview" },

  # --- Preview others ---
  { url = "*.cb[7rz]", run = "comicthumb" },

  { mime = "{image,audio,video}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  { url = "*.torrent", run = "torrent-preview" },
  { mime = "application/*bittorrent", run = "torrent-preview" },
  { mime = "application/epub+zip", run = "epub-preview" },

  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' }
]

[input]
cursor_blink = false
